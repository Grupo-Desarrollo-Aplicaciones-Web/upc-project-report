<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="798" viewBox="0 0 1400 798" role="img" aria-labelledby="title desc">
<title id="title">Rosa · S1 dueña de mype</title>
<desc id="desc">Persona provisional de diseño. El nombre no identifica a una participante ni describe una población medida.. Propuesta local provisional; no contiene resultados de entrevistas.</desc>
<rect width="1400" height="798" fill="#F3F6FB"/>
<style>text{font-family:Arial,sans-serif;fill:#17233A}.title{font-size:32px;font-weight:700}.sub{font-size:19px}.cardtitle{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#475569}</style>
<text x="36" y="54" class="title">Rosa · S1 dueña de mype</text>
<text x="36" y="87" class="sub">Persona provisional de diseño. El nombre no identifica a una participante ni describe una población medida.</text>
<rect x="36.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="192" class="cardtitle">Responsabilidad del segmento</text>
<text x="60.0" y="222" class="body">Dirige una mype comercial y decide o supervisa compras y</text>
<text x="60.0" y="246" class="body">pagos.</text>
<text x="60.0" y="270" class="body">Criterio de inclusión: participación en los últimos tres</text>
<text x="60.0" y="294" class="body">meses.</text>
<rect x="711.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="192" class="cardtitle">Objetivo por contrastar</text>
<text x="735.0" y="222" class="body">Averiguar saldo y vencimiento antes de priorizar o autorizar</text>
<text x="735.0" y="246" class="body">un pago.</text>
<text x="735.0" y="270" class="body">H-01 / US-004 e H-03 / US-007.</text>
<rect x="36.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="479" class="cardtitle">Contexto pendiente</text>
<text x="60.0" y="509" class="body">Edad, distrito, dispositivo, browser, canales y herramientas:</text>
<text x="60.0" y="533" class="body">por registrar con evidencia.</text>
<text x="60.0" y="557" class="body">No hay tamaño de mercado atribuido a esta Persona.</text>
<rect x="711.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="479" class="cardtitle">Preguntas para fundamentar la ficha</text>
<text x="735.0" y="509" class="body">G-03/G-04: consulta y vencimientos. D-01/D-02: decisiones y</text>
<text x="735.0" y="533" class="body">responsabilidades.</text>
<text x="735.0" y="557" class="body">Motivaciones y frustraciones requieren citas/minutos reales.</text>
<text x="36" y="774" class="note">CREDITOR · revisión local 2026-10-03 · evidencia de campo pendiente · sin publicación en UXPressia</text>
</svg>
