<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="798" viewBox="0 0 1400 798" role="img" aria-labelledby="title desc">
<title id="title">Diego · S2 encargado de finanzas</title>
<desc id="desc">Persona provisional de diseño. Solo se expresan criterios de reclutamiento e hipótesis de tareas.. Propuesta local provisional; no contiene resultados de entrevistas.</desc>
<rect width="1400" height="798" fill="#F3F6FB"/>
<style>text{font-family:Arial,sans-serif;fill:#17233A}.title{font-size:32px;font-weight:700}.sub{font-size:19px}.cardtitle{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#475569}</style>
<text x="36" y="54" class="title">Diego · S2 encargado de finanzas</text>
<text x="36" y="87" class="sub">Persona provisional de diseño. Solo se expresan criterios de reclutamiento e hipótesis de tareas.</text>
<rect x="36.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="192" class="cardtitle">Responsabilidad del segmento</text>
<text x="60.0" y="222" class="body">Registra compras, prepara pagos o concilia saldos en una mype.</text>
<text x="60.0" y="246" class="body">Criterio de inclusión: tarea directa en los últimos tres</text>
<text x="60.0" y="270" class="body">meses.</text>
<rect x="711.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="192" class="cardtitle">Objetivo por contrastar</text>
<text x="735.0" y="222" class="body">Conservar la relación compra–abono–comprobante para revisar el</text>
<text x="735.0" y="246" class="body">saldo.</text>
<text x="735.0" y="270" class="body">H-02 / US-005 e H-03 / US-006/007.</text>
<rect x="36.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="479" class="cardtitle">Contexto pendiente</text>
<text x="60.0" y="509" class="body">Edad, distrito, dispositivos, browser y coordinación: sin</text>
<text x="60.0" y="533" class="body">datos inferidos.</text>
<text x="60.0" y="557" class="body">S2 contiene un registro existente; faltan dos para el mínimo.</text>
<rect x="711.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="479" class="cardtitle">Preguntas para fundamentar la ficha</text>
<text x="735.0" y="509" class="body">G-02/G-05/G-06: compra, abono y conciliación. A-01 a A-04:</text>
<text x="735.0" y="533" class="body">datos y excepciones.</text>
<text x="735.0" y="557" class="body">No se atribuye una respuesta sin fuente y minuto.</text>
<text x="36" y="774" class="note">CREDITOR · revisión local 2026-10-03 · evidencia de campo pendiente · sin publicación en UXPressia</text>
</svg>
