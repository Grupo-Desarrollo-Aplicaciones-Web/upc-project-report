<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1372" viewBox="0 0 1400 1372" role="img" aria-labelledby="title desc">
<title id="title">Lean UX Canvas · CREDITOR</title>
<desc id="desc">Propuesta local actualizada. Supuestos y metas de piloto; no resultados de investigación ni prueba de producto.. Propuesta local provisional; no contiene resultados de entrevistas.</desc>
<rect width="1400" height="1372" fill="#F3F6FB"/>
<style>text{font-family:Arial,sans-serif;fill:#17233A}.title{font-size:32px;font-weight:700}.sub{font-size:19px}.cardtitle{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#475569}</style>
<text x="36" y="54" class="title">Lean UX Canvas · CREDITOR</text>
<text x="36" y="87" class="sub">Propuesta local actualizada. Supuestos y metas de piloto; no resultados de investigación ni prueba de</text>
<text x="36" y="112" class="sub">producto.</text>
<rect x="36.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="192" class="cardtitle">Problema y brecha por verificar</text>
<text x="60.0" y="222" class="body">Cuentas por pagar con información posiblemente fragmentada.</text>
<text x="60.0" y="246" class="body">La brecha propuesta es encaje del flujo, no ausencia de</text>
<text x="60.0" y="270" class="body">funciones en otros productos.</text>
<rect x="711.0" y="154" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="154" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="192" class="cardtitle">Segmentos y Personas provisionales</text>
<text x="735.0" y="222" class="body">S1 / Rosa: revisión y decisión. S2 / Diego: registro y</text>
<text x="735.0" y="246" class="body">conciliación.</text>
<text x="735.0" y="270" class="body">Roles pueden coexistir; sin market size ni demografía</text>
<text x="735.0" y="294" class="body">inventada.</text>
<rect x="36.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="479" class="cardtitle">Resultados de negocio propuestos</text>
<text x="60.0" y="509" class="body">BO-01: revisión semanal recurrente. BO-02: registros</text>
<text x="60.0" y="533" class="body">rastreables.</text>
<text x="60.0" y="557" class="body">BO-03: continuidad por préstamos/reportes cuando sean</text>
<text x="60.0" y="581" class="body">relevantes.</text>
<rect x="711.0" y="441" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="441" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="479" class="cardtitle">Beneficios por contrastar</text>
<text x="735.0" y="509" class="body">UB-01: saldo/vencimiento localizables. UB-02/03: compra y pago</text>
<text x="735.0" y="533" class="body">rastreables.</text>
<text x="735.0" y="557" class="body">UB-04/05: compromisos de préstamos y revisión filtrada futura.</text>
<rect x="36.0" y="728" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="728" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="766" class="cardtitle">Features e hipótesis TB1</text>
<text x="60.0" y="796" class="body">F-01/H-01: dashboard → US-004. F-02/H-02: compra → US-005.</text>
<text x="60.0" y="820" class="body">F-03/H-03: abonos/historial → US-006/007.</text>
<rect x="711.0" y="728" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="728" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="766" class="cardtitle">Features e hipótesis futuras</text>
<text x="735.0" y="796" class="body">F-04/H-04: préstamo y cronograma → US-009.</text>
<text x="735.0" y="820" class="body">F-05/H-05: filtros/exportación → US-008.</text>
<rect x="36.0" y="1015" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="36.0" y="1015" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="60.0" y="1053" class="cardtitle">Riesgos principales</text>
<text x="60.0" y="1083" class="body">No hay respuestas codificadas; faltan dos S2.</text>
<text x="60.0" y="1107" class="body">Puede duplicar la herramienta ya usada; precio/adopción sin</text>
<text x="60.0" y="1131" class="body">evidencia.</text>
<rect x="711.0" y="1015" width="653.0" height="265" rx="15" fill="white" stroke="#D4DFEF"/>
<rect x="711.0" y="1015" width="8" height="265" rx="4" fill="#2563EB"/>
<text x="735.0" y="1053" class="cardtitle">Experimentos propuestos</text>
<text x="735.0" y="1083" class="body">Completar entrevistas y codificar citas/minutos. Después:</text>
<text x="735.0" y="1107" class="body">prueba moderada y piloto autorizado.</text>
<text x="735.0" y="1131" class="body">Criterios/línea base antes de medir; no ejecutados en esta</text>
<text x="735.0" y="1155" class="body">revisión.</text>
<text x="36" y="1348" class="note">CREDITOR · revisión local 2026-10-03 · evidencia de campo pendiente · sin publicación en UXPressia</text>
</svg>
