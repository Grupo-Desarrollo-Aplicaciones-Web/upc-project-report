name: Exportar Reporte a Word

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generar-word:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Pandoc en la máquina virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: 3. Unir archivos Markdown y compilar a Word
        run: |
          pandoc \
            README.md \
            docs/00-project-information.md \
            docs/00-student-outcome.md \
            docs/01-introduction.md \
            docs/02-requirements-elicitation-analysis.md \
            docs/03-requirements-specification.md \
            docs/04-product-design.md \
            docs/05-implementation-validation-deployment.md \
            docs/06-conclusions-recommendations.md \
            docs/07-bibliography-appendices.md \
            docs/08-av1-delivery-checklist.md \
            --resource-path=.:docs \
            -o Reporte_Completo.docx

      - name: 4. Guardar archivo generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Word-UPC
          path: Reporte_Completo.docx
          retention-days: 7
