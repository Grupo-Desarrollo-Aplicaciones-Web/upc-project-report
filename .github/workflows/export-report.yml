name: Exportar Reporte a Word

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutar la exportación manualmente con un botón

jobs:
  generar-word:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Pandoc en la máquina virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: 3. Unir archivos Markdown y compilar a Word
        run: |
          cd docs
          pandoc \
            00-project-information.md \
            00-student-outcome.md \
            01-introduction.md \
            02-requirements-elicitation-analysis.md \
            03-requirements-specification.md \
            04-product-design.md \
            05-implementation-validation-deployment.md \
            06-conclusions-recommendations.md \
            07-bibliography-appendices.md \
            08-av1-delivery-checklist.md \
            -o Reporte_Completo.docx

      - name: 4. Guardar archivo generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Word-UPC
          path: docs/Reporte_Completo.docx
          retention-days: 7
